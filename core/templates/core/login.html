<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login — saccoApp</title>
</head>
<body>
    <h1>Login</h1>

    {% if messages %}
        <ul>
        {% for message in messages %}
            <li>{{ message }}</li>
        {% endfor %}
        </ul>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Log in</button>
    </form>

    <p>
        <a href="{% url 'register' %}">Register</a> |
        <a href="{% url 'password_reset' %}">Forgot password?</a>
    </p>
</body>
</html>
